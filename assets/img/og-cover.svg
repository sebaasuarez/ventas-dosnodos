<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAFAF7"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#FFB347" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFB347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.85" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#2F6BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#warm)"/>
  <rect width="1200" height="630" fill="url(#cool)"/>

  <g transform="translate(80,90)">
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="180" height="44" rx="22" fill="#2F6BFF" fill-opacity="0.10"/>
      <text x="90" y="29" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#2F6BFF" letter-spacing="2">DOS NODOS</text>
    </g>

    <text x="0" y="140" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="800" fill="#1E1E1E" letter-spacing="-2">Landing pages para</text>
    <text x="0" y="220" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="800" fill="#1E1E1E" letter-spacing="-2">negocios locales</text>
    <text x="0" y="300" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="800" fill="#2F6BFF" letter-spacing="-2">en Medellín.</text>

    <text x="0" y="370" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="500" fill="#5C5C5C">Conectadas a WhatsApp. Diseño + textos + formulario.</text>

    <g transform="translate(0, 410)">
      <rect x="0" y="0" width="320" height="64" rx="32" fill="#2F6BFF"/>
      <text x="160" y="42" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">Quiero mi landing</text>
    </g>
  </g>

  <g transform="translate(820,120)">
    <rect x="0" y="0" width="260" height="400" rx="36" fill="#0E1020"/>
    <rect x="12" y="12" width="236" height="376" rx="26" fill="#FAFAF7"/>
    <rect x="34" y="56" width="192" height="120" rx="14" fill="#EDF1FF"/>
    <rect x="48" y="74" width="80" height="20" rx="10" fill="#2F6BFF"/>
    <rect x="48" y="104" width="148" height="10" rx="5" fill="#1E1E1E"/>
    <rect x="48" y="120" width="110" height="10" rx="5" fill="#1E1E1E" fill-opacity="0.5"/>
    <rect x="48" y="142" width="120" height="22" rx="11" fill="#25D366"/>
    <rect x="34" y="196" width="192" height="36" rx="10" fill="#fff" stroke="#E9E5DD"/>
    <rect x="34" y="240" width="90" height="44" rx="10" fill="#fff" stroke="#E9E5DD"/>
    <rect x="136" y="240" width="90" height="44" rx="10" fill="#fff" stroke="#E9E5DD"/>
  </g>

  <g transform="translate(740,440)">
