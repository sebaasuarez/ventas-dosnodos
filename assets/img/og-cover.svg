<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#9333EA" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#9333EA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0.85" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#purpleGlow)"/>
  <rect width="1200" height="630" fill="url(#blueGlow)"/>

  <g transform="translate(80,90)">
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="220" height="44" rx="22" fill="#2563EB" fill-opacity="0.10"/>
      <text x="110" y="29" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#2563EB" letter-spacing="2">DOS NODOS</text>
    </g>

    <text x="0" y="140" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="800" fill="#111827" letter-spacing="-2">Landing pages para</text>
    <text x="0" y="220" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="800" fill="#111827" letter-spacing="-2">negocios locales</text>
    <text x="0" y="300" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="800" fill="url(#brand)" letter-spacing="-2">en Medellín.</text>

    <text x="0" y="370" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="500" fill="#4B5563">Conectadas a WhatsApp. Diseño + textos + formulario.</text>

    <g transform="translate(0, 410)">
      <rect x="0" y="0" width="340" height="64" rx="32" fill="url(#brand)"/>
      <text x="170" y="42" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">Quiero mi landing</text>
    </g>
  </g>

  <g transform="translate(830,90)">
    <g fill="none" stroke="url(#brand)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 380 L120 280 L210 340 L290 140 L290 60"/>
    </g>
    <circle cx="40" cy="380" r="34" fill="#2563EB"/>
    <circle cx="290" cy="60" r="34" fill="#9333EA"/>
  </g>

  <g transform="translate(820,460)">
    <rect x="0" y="0" width="320" height="60" rx="24" fill="#25D366"/>
    <text x="36" y="38" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#fff">¡Hola! ¿En qué te ayudamos?</text>
  </g>
</svg>
