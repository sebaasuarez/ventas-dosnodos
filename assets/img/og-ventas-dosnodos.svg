<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10256F"/>
      <stop offset="0.48" stop-color="#1B3FCC"/>
      <stop offset="1" stop-color="#6E2BD9"/>
    </linearGradient>
    <radialGradient id="limeGlow" cx="0.12" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#B4F032" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#B4F032" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="paperGlow" cx="0.9" cy="0.08" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#FFFFFF" stroke-opacity="0.065" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#07133D" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#limeGlow)"/>
  <rect width="1200" height="630" fill="url(#paperGlow)"/>

  <g transform="translate(72,62)">
    <g font-family="Geist Mono, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="2.4">
      <text x="0" y="20" fill="#B4F032">DOS NODOS · LANDINGS PARA VENDER</text>
      <text x="0" y="48" fill="#D9DDF6" opacity="0.82">MEDELLÍN · WHATSAPP BUSINESS · 3-5 DÍAS</text>
    </g>

    <g transform="translate(0,96)" font-family="Bricolage Grotesque, Arial, sans-serif" font-weight="700">
      <text x="0" y="78" font-size="72" letter-spacing="-1.3" fill="#FFFFFF">Páginas web</text>
      <text x="0" y="156" font-size="72" letter-spacing="-1.3" fill="#FFFFFF">para vender más</text>
      <text x="0" y="234" font-size="72" letter-spacing="-1.3" fill="#B4F032">por WhatsApp.</text>
    </g>

    <text x="0" y="382" font-family="Geist, Arial, sans-serif" font-size="24" fill="#EEF1FF" opacity="0.9">
      Diseño + textos + formulario + publicación.
    </text>

    <g transform="translate(0,426)" font-family="Geist, Arial, sans-serif">
      <rect x="0" y="0" width="172" height="56" rx="10" fill="#FFFFFF"/>
      <text x="86" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1530A6">Desde $350k</text>
      <rect x="190" y="0" width="146" height="56" rx="10" fill="#B4F032"/>
      <text x="263" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#233A06">3-5 días</text>
      <rect x="354" y="0" width="188" height="56" rx="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.36"/>
      <text x="448" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">Mobile first</text>
    </g>
  </g>

  <g transform="translate(754,80)" filter="url(#shadow)">
    <rect x="0" y="0" width="332" height="510" rx="38" fill="#111827"/>
    <rect x="18" y="18" width="296" height="474" rx="28" fill="#F0F2F5"/>
    <rect x="128" y="31" width="76" height="10" rx="5" fill="#111827" opacity="0.72"/>

    <g transform="translate(32,54)">
      <rect x="0" y="0" width="268" height="56" rx="14" fill="#075E54"/>
      <circle cx="31" cy="28" r="18" fill="#B4F032"/>
      <path d="M24 33 30 23 38 32" fill="none" stroke="#075E54" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="24" font-family="Geist, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Tu negocio</text>
      <text x="62" y="43" font-family="Geist, Arial, sans-serif" font-size="12" fill="#C8F7D2">en línea · responde rápido</text>
    </g>

    <g transform="translate(32,136)" font-family="Geist, Arial, sans-serif">
      <rect x="0" y="0" width="206" height="58" rx="14" fill="#FFFFFF"/>
      <text x="16" y="24" font-size="15" fill="#172033">Hola, quiero cotizar</text>
      <text x="16" y="44" font-size="15" fill="#172033">una landing para mi café</text>

      <rect x="58" y="86" width="210" height="68" rx="14" fill="#DCFCE7"/>
      <text x="74" y="112" font-size="15" font-weight="700" fill="#17351E">¡Claro! Te pasamos</text>
      <text x="74" y="134" font-size="15" font-weight="700" fill="#17351E">planes y agenda hoy.</text>

      <rect x="0" y="186" width="188" height="58" rx="14" fill="#FFFFFF"/>
      <text x="16" y="212" font-size="15" fill="#172033">Perfecto, lo necesito</text>
      <text x="16" y="232" font-size="15" fill="#172033">para esta semana.</text>

      <rect x="86" y="272" width="182" height="58" rx="14" fill="#DCFCE7"/>
      <text x="102" y="298" font-size="15" font-weight="700" fill="#17351E">Listo, arrancamos</text>
      <text x="102" y="318" font-size="15" font-weight="700" fill="#17351E">con tu contenido.</text>
    </g>

    <g transform="translate(32,438)">
      <rect x="0" y="0" width="210" height="34" rx="17" fill="#FFFFFF"/>
      <rect x="224" y="0" width="44" height="34" rx="17" fill="#25D366"/>
      <path d="M242 17h12m-5-5 5 5-5 5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="translate(1038,420)" opacity="0.95">
    <path d="M18 92 54 50 94 74 136 16 136 0" fill="none" stroke="#B4F032" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18" cy="92" r="17" fill="#B4F032"/>
    <circle cx="136" cy="0" r="17" fill="#FFFFFF"/>
  </g>
</svg>
